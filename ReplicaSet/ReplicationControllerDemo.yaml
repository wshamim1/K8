apiVersion: v1
kind: ReplicationController
metadata:
  name: myrc
  labels:
    app: myrc-app
spec:
  replicas: 3
  selector:
    app: front-end
  template:
    metadata:
      name: mypod
      labels:
        app: front-end
    spec:
      containers:
        - name: mynginx
          image: nginx
          ports:
            - containerPort: 80

